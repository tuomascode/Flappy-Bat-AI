[project]
name = "flappy-bat-ai"
requires-python = ">=3.11"
dependencies = [
    "pygame",
    "numpy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["flappy_bat"]
omit = ["flappy/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
